<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans SC";
        src: url("./assets/fonts/noto-sans-sc-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Noto Sans SC";
        src: url("./assets/fonts/noto-sans-sc-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      :root {
        --bg: #10140f;
        --ink: #f4f1e8;
        --muted: #a39e90;
        --accent: #d6ff4a;
        --card: #1b2218;
        --line: rgba(244, 241, 232, 0.14);
        --font: "Noto Sans SC", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(900px 520px at 18% 18%, rgba(214, 255, 74, 0.14), transparent 60%),
          radial-gradient(700px 480px at 88% 80%, rgba(244, 241, 232, 0.06), transparent 55%),
          var(--bg);
      }
      .clip { position: absolute; inset: 0; }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 120px 140px;
      }
      .kicker {
        font-size: 28px;
        letter-spacing: 0.22em;
        color: var(--accent);
        font-weight: 700;
      }
      h1 {
        margin-top: 28px;
        font-size: 108px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .lede {
        margin-top: 28px;
        font-size: 36px;
        color: var(--muted);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        margin-top: 48px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 40px 36px 44px;
        min-height: 360px;
      }
      .num {
        font-size: 28px;
        letter-spacing: 0.16em;
        color: var(--accent);
        font-weight: 700;
      }
      .card h2 {
        margin-top: 28px;
        font-size: 52px;
        letter-spacing: -0.03em;
      }
      .card p {
        margin-top: 18px;
        font-size: 28px;
        line-height: 1.45;
        color: var(--muted);
      }
      .end h1 { font-size: 92px; max-width: 1400px; }
      .clock {
        position: absolute;
        top: 56px;
        right: 72px;
        font-variant-numeric: tabular-nums;
        font-size: 28px;
        color: var(--muted);
      }
      .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 10px;
        width: 100%;
        background: var(--accent);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <section id="film" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div class="stage" id="intro">
          <div class="kicker">HYPERFRAMES</div>
          <h1>用 HTML 写视频</h1>
          <p class="lede">一份网页，就是一条可以反复渲染的片子。</p>
        </div>

        <div class="stage" id="steps" style="opacity: 0">
          <div class="kicker">三步做成</div>
          <div class="cards">
            <article class="card" id="card-1">
              <div class="num">01</div>
              <h2>写画面</h2>
              <p>画面和颜色都是普通的 HTML。</p>
            </article>
            <article class="card" id="card-2">
              <div class="num">02</div>
              <h2>排时间</h2>
              <p>用 data-start 和一条可定位的时间轴决定何时出现。</p>
            </article>
            <article class="card" id="card-3">
              <div class="num">03</div>
              <h2>导出</h2>
              <p>同一份输入，<br />每次都得到同一条片子。</p>
            </article>
          </div>
        </div>

        <div class="stage end" id="end" style="opacity: 0">
          <div class="kicker">DEMO</div>
          <h1>同一份 HTML，<br />每一次渲染都一样。</h1>
        </div>

        <div class="clock" id="clock">00:00</div>
        <div class="bar" id="bar"></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const clock = document.getElementById("clock");

      tl.from("#intro .kicker", { y: 24, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.2);
      tl.from("#intro h1", { y: 36, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.35);
      tl.from("#intro .lede", { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.6);

      tl.to("#intro", { opacity: 0, y: -28, duration: 0.4, ease: "power2.in" }, 4.0);
      tl.fromTo("#steps", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.25);
      tl.from("#card-1", { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 4.4);
      tl.from("#card-2", { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 4.62);
      tl.from("#card-3", { y: 40, opacity: 0, duration: 0.45, ease: "power3.out" }, 4.84);

      tl.to("#steps", { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, 8.5);
      tl.fromTo("#end", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.75);

      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 12, ease: "none" }, 0);
      tl.to({}, {
        duration: 12,
        ease: "none",
        onUpdate: () => {
          clock.textContent = tl.time().toFixed(1) + "s";
        },
      }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
    </script>
  </body>
</html>
